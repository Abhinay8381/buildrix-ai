spring:
  application:
    name: buildrix-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:9010/buildrix-DB}
    username: ${DB_USER:user}
    password: ${DB_PASS:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  threads:
    virtual:
      enabled: true

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:YOUR_OPENROUTER_API_KEY_HERE}
      base-url: https://openrouter.ai/api/v1
      chat:
        temperature: 0.0
        #model: google/gemma-4-26b-a4b-it:free
        #model: x-ai/grok-code-fast-1
        model: openai/gpt-5.6-luna
jwt:
  secret-key: ${JWT_SECRET:dont-use-in-production4135265253735gdrdgr}

stripe:
  api:
    secret: ${STRIPE_API_SECRET:YOUR_STRIPE_SECRET_KEY_HERE}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:YOUR_STRIPE_WEBHOOK_SECRET_HERE}

client:
  url: http://localhost:8080

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG

minio:
  url: http://localhost:9000          # or minio:9000 if inside docker network
  access-key: minioadmin
  secret-key: minioadmin123
  project-bucket: projects
  starter-project-bucket: starter-projects
  react-vite-tailwind-daisyui-starter: react-vite-tailwind-daisyui-starter


